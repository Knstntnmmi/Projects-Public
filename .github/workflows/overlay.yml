name: overlay

on:
  push:
    paths: ['overlay/**', '.github/workflows/overlay.yml']
  pull_request:
    paths: ['overlay/**', '.github/workflows/overlay.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
